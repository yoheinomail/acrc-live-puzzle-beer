
<!DOCTYPE html>
<html>
<head>
  <title>🎏 ACRC ナレ４_Liveパズル！</title>
  <style>
    body {
      background: #222;
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #puzzle {
      display: grid;
      grid-template-columns: repeat(14, 73px);
      grid-template-rows: repeat(10, 102px);
      gap: 0;
      width: fit-content;
      margin: auto;
    }
    .piece {
      width: 73px;
      height: 102px;
      background-color: #000;
      background-size: cover;
      image-rendering: pixelated;
    }
    #clock {
      color: white;
      font-size: 31px;
      font-family: monospace;
      margin-right: 20px;
    }
    #iiizo {
      width: 180px;
      height: auto;
      position: fixed;
      top: 60px;
      left: 160px;
      transform: none;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      animation: none;
      filter: drop-shadow(2px 2px 4px black) brightness(3) grayscale(1);
    }
    @keyframes popFade {
      0% { opacity: 0; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1.2); }
    }
  </style>
  <audio id="popSound" src="pop.mp3" preload="auto"></audio>
  <audio id="milestoneSound" src="milestone.mp3" preload="auto"></audio>
  <audio id="goalSound" src="goal.mp3" preload="auto"></audio>
</head>
<body>
  <div style="display: flex; align-items: center; justify-content: center; margin-top: 20px;">
    <div id="clock">⏰ --</div>
    <h1 style="margin: 0;">🎏 ACRC ナレ４_Liveパズル！</h1>
  </div>
  <img id="iiizo" src="ma185_2_3.png" alt="わーい" />
  <p>ACRCメンバーの出席人数を自動カウントしています</p>
  <input type="number" id="countInput" min="0" max="140" value="0" oninput="updatePuzzle()" />
  <div style="margin-bottom: 1em; color: white; font-size: 18px;">
    出席人数：<span id="currentCount">0</span>人　
    完成率：<span id="completionRate">0</span>%
  </div>
  <div id="puzzle"></div>

<script>
  const totalPieces = 140;
  const rows = 10;
  const cols = 14;
  const puzzleDiv = document.getElementById("puzzle");

  const allPieces = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      allPieces.push({ row: r, col: c, key: r + "_" + c });
    }
  }
  const randomOrder = allPieces.map(p => p.key).sort(() => Math.random() - 0.5);

  let previousCount = 0;
  function updatePuzzle() {
    const count = parseInt(document.getElementById("countInput").value);
    document.getElementById("currentCount").textContent = count;
    document.getElementById("completionRate").textContent = Math.round((count / totalPieces) * 100);
    puzzleDiv.innerHTML = "";

    const visibleSet = new Set(randomOrder.slice(0, count));
    allPieces.forEach(p => {
      const div = document.createElement("div");
      div.className = "piece";
      if (visibleSet.has(p.key)) {
        div.style.backgroundImage = `url('pieces/piece_${p.key}.png')`;

        let sound;
        if (count === 140) {
          sound = document.getElementById('goalSound');
        } else if (count % 10 === 0) {
          sound = document.getElementById('milestoneSound');
        } else {
          sound = document.getElementById('popSound');
        }

        if (!puzzleDiv.querySelector(`[data-key="${p.key}"]`)) {
          sound.currentTime = 0;
          sound.play();

          const iiizo = document.getElementById("iiizo");
          iiizo.style.animation = "none";
          void iiizo.offsetWidth;
          iiizo.style.animation = "popFade 1.5s ease-out";
        }
      }
      div.setAttribute("data-key", p.key);
      puzzleDiv.appendChild(div);
    });
    previousCount = count;
  }

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `⏰ ${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();
  updatePuzzle();
</script>
</body>
</html>
